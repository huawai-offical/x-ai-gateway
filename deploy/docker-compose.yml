services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: x_ai_gateway
      POSTGRES_USER: ${DB_USERNAME:-x_ai_gateway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-x_ai_gateway} -d x_ai_gateway"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - xag-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change-me} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - xag-redis-data:/data

  gateway:
    image: ${X_AI_GATEWAY_IMAGE:-x-ai-gateway:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ../.data/files:/app/.data/files
      - ../output/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  xag-postgres-data:
  xag-redis-data:
