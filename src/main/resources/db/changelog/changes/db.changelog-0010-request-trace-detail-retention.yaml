databaseChangeLog:
  - changeSet:
      id: 0010-request-trace-detail-retention-fields
      author: codex
      changes:
        - addColumn:
            tableName: request_trace_detail
            columns:
              - column:
                  name: metadata_hash
                  type: VARCHAR(128)
              - column:
                  name: metadata_original_length
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: metadata_stored_length
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: metadata_truncated
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: metadata_redacted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            tableName: request_trace_detail
            indexName: idx_request_trace_detail_expires_at
            columns:
              - column:
                  name: expires_at
  - changeSet:
      id: 0010-request-trace-detail-archive
      author: codex
      changes:
        - createTable:
            tableName: request_trace_detail_archive
            remarks: 请求详情追踪 TTL 清理归档摘要，记录每次清理覆盖窗口、阶段计数和状态。
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_request_trace_detail_archive
                    nullable: false
              - column:
                  name: archive_batch_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: cutoff_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: archived_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: earliest_created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: latest_created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: stage_counts_json
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: COMPLETED
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: VARCHAR(1000)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: request_trace_detail_archive
            indexName: idx_request_trace_detail_archive_cutoff
            columns:
              - column:
                  name: cutoff_at
              - column:
                  name: created_at
