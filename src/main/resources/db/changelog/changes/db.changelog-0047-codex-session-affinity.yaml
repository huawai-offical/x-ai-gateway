databaseChangeLog:
  - changeSet:
      id: 0047-codex-session-affinity
      author: codex
      changes:
        - addColumn:
            tableName: request_log
            columns:
              - column: { name: session_affinity_source, type: VARCHAR(64) }
              - column: { name: session_affinity_key, type: VARCHAR(64) }
        - createIndex:
            tableName: request_log
            indexName: idx_request_log_session_affinity_started
            columns:
              - column: { name: session_affinity_key }
              - column: { name: started_at }
