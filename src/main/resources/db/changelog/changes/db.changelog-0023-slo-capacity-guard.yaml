databaseChangeLog:
  - changeSet:
      id: 0023-slo-capacity-guard
      author: codex
      changes:
        - createTable:
            tableName: slo_policy
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: policy_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: scope_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: scope_ref
                  type: VARCHAR(128)
              - column:
                  name: window_minutes
                  type: INT
                  defaultValueNumeric: 60
                  constraints:
                    nullable: false
              - column:
                  name: error_budget_ratio
                  type: "DECIMAL(10,4)"
                  constraints:
                    nullable: false
              - column:
                  name: warning_burn_rate
                  type: "DECIMAL(10,2)"
                  constraints:
                    nullable: false
              - column:
                  name: critical_burn_rate
                  type: "DECIMAL(10,2)"
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(512)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: slo_policy
            indexName: idx_slo_policy_enabled
            columns:
              - column:
                  name: enabled
        - createIndex:
            tableName: slo_policy
            indexName: idx_slo_policy_scope
            columns:
              - column:
                  name: scope_type
              - column:
                  name: scope_ref
        - createTable:
            tableName: alert_silence
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: silence_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(64)
              - column:
                  name: severity
                  type: VARCHAR(16)
              - column:
                  name: entity_type
                  type: VARCHAR(64)
              - column:
                  name: entity_ref
                  type: VARCHAR(128)
              - column:
                  name: starts_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: ends_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(512)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: alert_silence
            indexName: idx_alert_silence_enabled
            columns:
              - column:
                  name: enabled
        - createIndex:
            tableName: alert_silence
            indexName: idx_alert_silence_event
            columns:
              - column:
                  name: event_type
              - column:
                  name: severity
        - createIndex:
            tableName: alert_silence
            indexName: idx_alert_silence_entity
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_ref
