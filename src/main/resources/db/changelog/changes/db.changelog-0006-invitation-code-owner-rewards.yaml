databaseChangeLog:
  - changeSet:
      id: 0006-invitation-code-owner-rewards
      author: codex
      changes:
        - addColumn:
            tableName: invitation_code
            columns:
              - column:
                  name: owner_user_id
                  type: BIGINT
              - column:
                  name: reward_token_credits
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addColumn:
            tableName: invitation_code_usage
            columns:
              - column:
                  name: reward_token_credits
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: invitation_code
            baseColumnNames: owner_user_id
            referencedTableName: gateway_user
            referencedColumnNames: id
            constraintName: fk_invitation_code_owner_user_id
        - createIndex:
            tableName: invitation_code
            indexName: idx_invitation_code_owner_user
            columns:
              - column:
                  name: owner_user_id
