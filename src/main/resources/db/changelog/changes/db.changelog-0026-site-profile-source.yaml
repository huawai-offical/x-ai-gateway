databaseChangeLog:
  - changeSet:
      id: 0026-site-profile-source
      author: codex
      changes:
        - addColumn:
            tableName: upstream_site_profile
            columns:
              - column:
                  name: profile_source
                  type: VARCHAR(32)
                  defaultValue: MANUAL
                  constraints:
                    nullable: false
