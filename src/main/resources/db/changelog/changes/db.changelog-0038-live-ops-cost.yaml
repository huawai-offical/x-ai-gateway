databaseChangeLog:
  - changeSet:
      id: 0038-live-ops-cost
      author: codex
      changes:
        - createTable:
            tableName: live_session
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: session_key, type: VARCHAR(96), constraints: { nullable: false } }
              - column: { name: distributed_key_id, type: BIGINT }
              - column: { name: model_name, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: protocol, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: resume_token, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: last_event_id, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: input_audio_bytes, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: output_audio_bytes, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: event_count, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: metadata_json, type: TEXT }
              - column: { name: expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: closed_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: live_session
            columnNames: session_key
            constraintName: uk_live_session_session_key
        - addUniqueConstraint:
            tableName: live_session
            columnNames: resume_token
            constraintName: uk_live_session_resume_token
        - createTable:
            tableName: live_session_event
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: session_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: event_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: event_type, type: VARCHAR(96), constraints: { nullable: false } }
              - column: { name: direction, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: payload_json, type: TEXT }
              - column: { name: audio_bytes, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: live_session_event
            baseColumnNames: session_id
            referencedTableName: live_session
            referencedColumnNames: id
            constraintName: fk_live_session_event_session
        - addUniqueConstraint:
            tableName: live_session_event
            columnNames: session_id,event_id
            constraintName: uk_live_session_event_session_event
        - createIndex:
            tableName: live_session_event
            indexName: idx_live_session_event_session_event
            columns:
              - column: { name: session_id }
              - column: { name: event_id }
        - createTable:
            tableName: ops_probe_run
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: probe_name, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: target_url, type: VARCHAR(1024), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: severity, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: source, type: VARCHAR(96), constraints: { nullable: false } }
              - column: { name: latency_ms, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: status_code, type: INT }
              - column: { name: error_message, type: VARCHAR(1024) }
              - column: { name: detail_json, type: TEXT }
              - column: { name: started_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: completed_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - createIndex:
            tableName: ops_probe_run
            indexName: idx_ops_probe_run_created
            columns:
              - column: { name: created_at }
        - createTable:
            tableName: ops_system_event
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: event_type, type: VARCHAR(96), constraints: { nullable: false } }
              - column: { name: severity, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: source, type: VARCHAR(96), constraints: { nullable: false } }
              - column: { name: entity_type, type: VARCHAR(96) }
              - column: { name: entity_ref, type: VARCHAR(256) }
              - column: { name: title, type: VARCHAR(256), constraints: { nullable: false } }
              - column: { name: detail_json, type: TEXT }
              - column: { name: occurred_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - createIndex:
            tableName: ops_system_event
            indexName: idx_ops_system_event_filter
            columns:
              - column: { name: severity }
              - column: { name: source }
              - column: { name: occurred_at }
        - createTable:
            tableName: cost_model
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: provider_type, type: VARCHAR(96), constraints: { nullable: false } }
              - column: { name: model_name, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: currency, type: VARCHAR(16), defaultValue: USD, constraints: { nullable: false } }
              - column: { name: input_token_micros, type: BIGINT, defaultValueNumeric: 100, constraints: { nullable: false } }
              - column: { name: output_token_micros, type: BIGINT, defaultValueNumeric: 300, constraints: { nullable: false } }
              - column: { name: cache_hit_token_micros, type: BIGINT, defaultValueNumeric: 20, constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: notes, type: VARCHAR(512) }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - createIndex:
            tableName: cost_model
            indexName: idx_cost_model_provider_model
            columns:
              - column: { name: provider_type }
              - column: { name: model_name }
              - column: { name: active }
