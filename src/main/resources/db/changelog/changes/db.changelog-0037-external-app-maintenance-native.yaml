databaseChangeLog:
  - changeSet:
      id: 0037-external-app-maintenance-native
      author: codex
      changes:
        - createTable:
            tableName: dashboard_external_app
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_name, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: slug, type: VARCHAR(96), constraints: { nullable: false } }
              - column: { name: iframe_url, type: VARCHAR(1024), constraints: { nullable: false } }
              - column: { name: allowed_origin, type: VARCHAR(512), constraints: { nullable: false } }
              - column: { name: sandbox_permissions, type: VARCHAR(512) }
              - column: { name: signing_secret_ciphertext, type: TEXT }
              - column: { name: signing_secret_fingerprint, type: VARCHAR(128) }
              - column: { name: enabled, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: nav_enabled, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(512) }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: dashboard_external_app
            columnNames: slug
            constraintName: uk_dashboard_external_app_slug
        - createIndex:
            tableName: dashboard_external_app
            indexName: idx_dashboard_external_app_nav
            columns:
              - column: { name: enabled }
              - column: { name: nav_enabled }
        - createTable:
            tableName: maintenance_run
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: run_type, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: dry_run, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: confirm_required, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: confirmed, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: artifact_path, type: VARCHAR(1024) }
              - column: { name: artifact_checksum, type: VARCHAR(128) }
              - column: { name: actor, type: VARCHAR(128) }
              - column: { name: source_ref, type: VARCHAR(256) }
              - column: { name: duration_ms, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: detail_json, type: TEXT }
              - column: { name: error_message, type: VARCHAR(1024) }
              - column: { name: started_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: completed_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - createIndex:
            tableName: maintenance_run
            indexName: idx_maintenance_run_type_created
            columns:
              - column: { name: run_type }
              - column: { name: created_at }
