    - update:
        tableName: upstream_site_profile
        columns:
        - column:
            name: profile_source
            value: AUTO_DISCOVERED
        where: description = '由凭证自动推断生成的站点档案。'
    - sql:
        sql: "INSERT INTO upstream_account_group (\n  group_name,\n  provider_type,\n  supported_models_json,\n  supported_protocols_json,\n\
          \  allowed_client_families_json,\n  is_active,\n  description,\n  created_at,\n  updated_at\n) SELECT\n  'default',\n\
          \  'OPENAI_OAUTH',\n  '[]',\n  '[\"openai\",\"responses\"]',\n  '[\"GENERIC_OPENAI\",\"CODEX\"]',\n  TRUE,\n  '系统默认账号分组',\n\
          \  CURRENT_TIMESTAMP,\n  CURRENT_TIMESTAMP\nWHERE NOT EXISTS (\n  SELECT 1 FROM upstream_account_group WHERE lower(group_name)\
          \ = 'default'\n);\n"
    - sql:
        sql: "UPDATE upstream_credential SET group_id = (\n  SELECT id\n  FROM upstream_account_group\n  WHERE lower(group_name)\
          \ = 'default'\n  ORDER BY id\n  LIMIT 1\n) WHERE group_id IS NULL;\n"
