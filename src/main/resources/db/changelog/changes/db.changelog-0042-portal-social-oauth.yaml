databaseChangeLog:
  - changeSet:
      id: 0042-portal-social-oauth
      author: codex
      changes:
        - createTable:
            tableName: portal_social_oauth_session
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: state, type: VARCHAR(96), constraints: { nullable: false } }
              - column: { name: provider, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: authorization_url, type: TEXT }
              - column: { name: redirect_path, type: VARCHAR(256) }
              - column: { name: code_verifier, type: VARCHAR(256) }
              - column: { name: metadata_json, type: TEXT }
              - column: { name: expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: portal_social_oauth_session
            columnNames: state
            constraintName: uk_portal_social_oauth_session_state
        - createTable:
            tableName: gateway_user_social_identity
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: provider, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: external_subject, type: VARCHAR(191), constraints: { nullable: false } }
              - column: { name: email, type: VARCHAR(191) }
              - column: { name: display_name, type: VARCHAR(128) }
              - column: { name: last_login_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: metadata_json, type: TEXT }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: gateway_user_social_identity
            baseColumnNames: user_id
            referencedTableName: gateway_user
            referencedColumnNames: id
            constraintName: fk_user_social_identity_user
        - addUniqueConstraint:
            tableName: gateway_user_social_identity
            columnNames: provider,external_subject
            constraintName: uk_user_social_identity_provider_subject
        - createIndex:
            tableName: gateway_user_social_identity
            indexName: idx_user_social_identity_user
            columns:
              - column: { name: user_id }
