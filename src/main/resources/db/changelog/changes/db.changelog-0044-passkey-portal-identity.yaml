databaseChangeLog:
  - changeSet:
      id: 0044-passkey-portal-identity
      author: codex
      changes:
        - createTable:
            tableName: gateway_user_passkey_credential
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: credential_id, type: VARCHAR(256), constraints: { nullable: false } }
              - column: { name: credential_name, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: public_key_pem, type: TEXT, constraints: { nullable: false } }
              - column: { name: rp_id, type: VARCHAR(191), constraints: { nullable: false } }
              - column: { name: origin, type: VARCHAR(256), constraints: { nullable: false } }
              - column: { name: transports_json, type: TEXT }
              - column: { name: metadata_json, type: TEXT }
              - column: { name: sign_count, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: is_active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: last_used_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: gateway_user_passkey_credential
            baseColumnNames: user_id
            referencedTableName: gateway_user
            referencedColumnNames: id
            constraintName: fk_user_passkey_credential_user
        - addUniqueConstraint:
            tableName: gateway_user_passkey_credential
            columnNames: credential_id
            constraintName: uk_user_passkey_credential_id
        - createIndex:
            tableName: gateway_user_passkey_credential
            indexName: idx_user_passkey_user_active
            columns:
              - column: { name: user_id }
              - column: { name: is_active }
        - createIndex:
            tableName: gateway_user_passkey_credential
            indexName: idx_user_passkey_created_at
            columns:
              - column: { name: created_at }
