databaseChangeLog:
  - changeSet:
      id: 0022-governance-policy-engine
      author: codex
      changes:
        - createTable:
            tableName: route_guard_policy
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: policy_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: target_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: provider_type
                  type: VARCHAR(32)
              - column:
                  name: site_profile_id
                  type: BIGINT
              - column:
                  name: credential_id
                  type: BIGINT
              - column:
                  name: account_id
                  type: BIGINT
              - column:
                  name: proxy_id
                  type: BIGINT
              - column:
                  name: policy_mode
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: action_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: ttl_seconds
                  type: INT
              - column:
                  name: priority
                  type: INT
                  defaultValueNumeric: 100
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(512)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createTable:
            tableName: auto_action_rule
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rule_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: severity
                  type: VARCHAR(16)
              - column:
                  name: entity_type
                  type: VARCHAR(64)
              - column:
                  name: action_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: ttl_seconds
                  type: INT
              - column:
                  name: recovery_mode
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(512)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createTable:
            tableName: quarantine_record
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: target_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: provider_type
                  type: VARCHAR(32)
              - column:
                  name: site_profile_id
                  type: BIGINT
              - column:
                  name: credential_id
                  type: BIGINT
              - column:
                  name: account_id
                  type: BIGINT
              - column:
                  name: proxy_id
                  type: BIGINT
              - column:
                  name: source_rule_id
                  type: BIGINT
              - column:
                  name: source_event_id
                  type: BIGINT
              - column:
                  name: action_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: recovery_mode
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: released_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: release_reason
                  type: VARCHAR(512)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
