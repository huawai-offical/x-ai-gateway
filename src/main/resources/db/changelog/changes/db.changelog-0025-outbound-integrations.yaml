databaseChangeLog:
  - changeSet:
      id: 0025-outbound-integrations
      author: codex
      changes:
        - createTable:
            tableName: webhook_endpoint
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: endpoint_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: endpoint_url
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: secret_ciphertext
                  type: TEXT
              - column:
                  name: secret_fingerprint
                  type: VARCHAR(128)
              - column:
                  name: signing_mode
                  type: VARCHAR(32)
                  defaultValue: HMAC_SHA256
                  constraints:
                    nullable: false
              - column:
                  name: timeout_ms
                  type: INT
                  defaultValueNumeric: 5000
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: webhook_endpoint
            indexName: idx_webhook_endpoint_enabled
            columns:
              - column:
                  name: enabled
        - createTable:
            tableName: notification_channel
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: channel_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: channel_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: webhook_endpoint_id
                  type: BIGINT
              - column:
                  name: email_to
                  type: VARCHAR(1024)
              - column:
                  name: template_mode
                  type: VARCHAR(32)
                  defaultValue: DEFAULT
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: notification_channel
            indexName: idx_notification_channel_type
            columns:
              - column:
                  name: channel_type
              - column:
                  name: enabled
        - createTable:
            tableName: runbook_link
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: link_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(64)
              - column:
                  name: entity_type
                  type: VARCHAR(64)
              - column:
                  name: link_url
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(512)
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: runbook_link
            indexName: idx_runbook_link_lookup
            columns:
              - column:
                  name: event_type
              - column:
                  name: entity_type
              - column:
                  name: enabled
        - createTable:
            tableName: outbound_event_subscription
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: subscription_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: channel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(64)
              - column:
                  name: severity
                  type: VARCHAR(16)
              - column:
                  name: entity_type
                  type: VARCHAR(64)
              - column:
                  name: provider_type
                  type: VARCHAR(32)
              - column:
                  name: site_profile_id
                  type: BIGINT
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: outbound_event_subscription
            indexName: idx_outbound_subscription_match
            columns:
              - column:
                  name: event_type
              - column:
                  name: severity
              - column:
                  name: entity_type
              - column:
                  name: provider_type
              - column:
                  name: site_profile_id
              - column:
                  name: enabled
        - createTable:
            tableName: outbound_delivery
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: channel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: VARCHAR(64)
              - column:
                  name: entity_ref
                  type: VARCHAR(128)
              - column:
                  name: request_id
                  type: VARCHAR(128)
              - column:
                  name: gateway_resource_key
                  type: VARCHAR(128)
              - column:
                  name: upstream_object_id
                  type: VARCHAR(128)
              - column:
                  name: delivery_status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: attempt_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: next_retry_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_error
                  type: VARCHAR(1024)
              - column:
                  name: response_code
                  type: INT
              - column:
                  name: response_summary
                  type: VARCHAR(1024)
              - column:
                  name: payload_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: delivered_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: outbound_delivery
            indexName: idx_outbound_delivery_status
            columns:
              - column:
                  name: delivery_status
              - column:
                  name: next_retry_at
        - createIndex:
            tableName: outbound_delivery
            indexName: idx_outbound_delivery_event
            columns:
              - column:
                  name: event_type
              - column:
                  name: occurred_at
        - createIndex:
            tableName: outbound_delivery
            indexName: idx_outbound_delivery_request
            columns:
              - column:
                  name: request_id
        - createIndex:
            tableName: outbound_delivery
            indexName: idx_outbound_delivery_entity
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_ref
