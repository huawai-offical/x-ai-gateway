databaseChangeLog:
  - changeSet:
      id: 0008-credential-connectivity-probe
      author: codex
      changes:
        - addColumn:
            tableName: upstream_credential
            columns:
              - column:
                  name: connectivity_status
                  type: VARCHAR(32)
              - column:
                  name: last_connectivity_test_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_connectivity_latency_ms
                  type: BIGINT
              - column:
                  name: last_connectivity_error_message
                  type: VARCHAR(512)
              - column:
                  name: last_connectivity_response_summary
                  type: VARCHAR(512)
              - column:
                  name: last_connectivity_upstream_request_id
                  type: VARCHAR(128)
              - column:
                  name: last_connectivity_model
                  type: VARCHAR(128)
