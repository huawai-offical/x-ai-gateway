databaseChangeLog:
  - changeSet:
      id: 0027-credential-pool-default
      author: codex
      changes:
        - addColumn:
            tableName: upstream_credential
            columns:
              - column:
                  name: pool_id
                  type: BIGINT
        - sql:
            sql: >
              INSERT INTO upstream_account_pool (
                pool_name,
                provider_type,
                supported_models_json,
                supported_protocols_json,
                allowed_client_families_json,
                is_active,
                description,
                created_at,
                updated_at
              )
              SELECT
                'default',
                'OPENAI_OAUTH',
                '[]',
                '["openai","responses"]',
                '["GENERIC_OPENAI","CODEX"]',
                TRUE,
                '系统默认账号池',
                CURRENT_TIMESTAMP,
                CURRENT_TIMESTAMP
              WHERE NOT EXISTS (
                SELECT 1 FROM upstream_account_pool WHERE lower(pool_name) = 'default'
              );
        - sql:
            sql: >
              UPDATE upstream_credential
              SET pool_id = (
                SELECT id
                FROM upstream_account_pool
                WHERE lower(pool_name) = 'default'
                ORDER BY id
                LIMIT 1
              )
              WHERE pool_id IS NULL;
        - addNotNullConstraint:
            tableName: upstream_credential
            columnName: pool_id
            columnDataType: BIGINT
        - addForeignKeyConstraint:
            baseTableName: upstream_credential
            baseColumnNames: pool_id
            referencedTableName: upstream_account_pool
            referencedColumnNames: id
            constraintName: fk_upstream_credential_pool
        - createIndex:
            tableName: upstream_credential
            indexName: idx_upstream_credential_pool_deleted
            columns:
              - column:
                  name: pool_id
              - column:
                  name: deleted
