databaseChangeLog:
  - changeSet:
      id: 0021-gateway-async-resource-upstream-object
      author: codex
      changes:
        - addColumn:
            tableName: gateway_async_resource
            columns:
              - column:
                  name: upstream_object_id
                  type: varchar(256)
                  remarks: 上游对象名或 ID，用于 Google native 资源反查。
        - createIndex:
            tableName: gateway_async_resource
            indexName: idx_gateway_async_resource_upstream_object
            columns:
              - column:
                  name: distributed_key_id
              - column:
                  name: resource_type
              - column:
                  name: upstream_object_id
