databaseChangeLog:
  - changeSet:
      id: 0049-openai-idempotency-record
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: openai_idempotency_record
      changes:
        - createTable:
            tableName: openai_idempotency_record
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: distributed_key_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: request_path, type: VARCHAR(256), constraints: { nullable: false } }
              - column: { name: idempotency_key, type: VARCHAR(256), constraints: { nullable: false } }
              - column: { name: request_fingerprint, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: response_status, type: INT, constraints: { nullable: false } }
              - column: { name: response_object_type, type: VARCHAR(128) }
              - column: { name: response_payload_json, type: TEXT, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: openai_idempotency_record
            baseColumnNames: distributed_key_id
            referencedTableName: distributed_key
            referencedColumnNames: id
            constraintName: fk_openai_idempotency_distributed_key
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: openai_idempotency_record
            columnNames: distributed_key_id,request_path,idempotency_key
            constraintName: uk_openai_idempotency_scope
        - createIndex:
            tableName: openai_idempotency_record
            indexName: idx_openai_idempotency_key_created
            columns:
              - column: { name: distributed_key_id }
              - column: { name: created_at }
        - createIndex:
            tableName: openai_idempotency_record
            indexName: idx_openai_idempotency_path_created
            columns:
              - column: { name: request_path }
              - column: { name: created_at }
