databaseChangeLog:
  - changeSet:
      id: 0033-portal-user-session
      author: codex
      changes:
        - addColumn:
            tableName: gateway_user
            columns:
              - column:
                  name: password_hash
                  type: VARCHAR(256)
        - addColumn:
            tableName: distributed_key
            columns:
              - column:
                  name: owner_user_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: distributed_key
            baseColumnNames: owner_user_id
            referencedTableName: gateway_user
            referencedColumnNames: id
            constraintName: fk_distributed_key_owner_user_id
        - createIndex:
            tableName: distributed_key
            indexName: idx_distributed_key_owner_user_id
            columns:
              - column:
                  name: owner_user_id
