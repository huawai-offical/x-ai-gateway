databaseChangeLog:
  - changeSet:
      id: 0032-user-domain-core
      author: codex
      changes:
        - createTable:
            tableName: gateway_user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(191)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(128)
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: last_login_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: gateway_user
            columnNames: email
            constraintName: uk_gateway_user_email
        - createIndex:
            tableName: gateway_user
            indexName: idx_gateway_user_is_active
            columns:
              - column:
                  name: is_active
        - createIndex:
            tableName: gateway_user
            indexName: idx_gateway_user_created_at
            columns:
              - column:
                  name: created_at

        - createTable:
            tableName: subscription_plan
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: default_duration_days
                  type: INT
                  defaultValueNumeric: 30
                  constraints:
                    nullable: false
              - column:
                  name: max_active_keys
                  type: INT
                  defaultValueNumeric: 3
                  constraints:
                    nullable: false
              - column:
                  name: rpm_limit
                  type: INT
                  defaultValueNumeric: 60
                  constraints:
                    nullable: false
              - column:
                  name: tpm_limit
                  type: INT
                  defaultValueNumeric: 120000
                  constraints:
                    nullable: false
              - column:
                  name: concurrency_limit
                  type: INT
                  defaultValueNumeric: 2
                  constraints:
                    nullable: false
              - column:
                  name: daily_token_limit
                  type: BIGINT
                  defaultValueNumeric: 1000000
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: subscription_plan
            columnNames: plan_name
            constraintName: uk_subscription_plan_name
        - createIndex:
            tableName: subscription_plan
            indexName: idx_subscription_plan_is_active
            columns:
              - column:
                  name: is_active

        - createTable:
            tableName: user_subscription
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: plan_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(24)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: starts_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: auto_renew
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_subscription
            baseColumnNames: user_id
            referencedTableName: gateway_user
            referencedColumnNames: id
            constraintName: fk_user_subscription_user_id
        - addForeignKeyConstraint:
            baseTableName: user_subscription
            baseColumnNames: plan_id
            referencedTableName: subscription_plan
            referencedColumnNames: id
            constraintName: fk_user_subscription_plan_id
        - createIndex:
            tableName: user_subscription
            indexName: idx_user_subscription_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: user_subscription
            indexName: idx_user_subscription_plan_id
            columns:
              - column:
                  name: plan_id
        - createIndex:
            tableName: user_subscription
            indexName: idx_user_subscription_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: user_subscription
            indexName: idx_user_subscription_created_at
            columns:
              - column:
                  name: created_at
