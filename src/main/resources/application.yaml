spring:
  application:
    name: x-ai-gateway
  ai:
    model:
      chat: none
      embedding: none
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:disabled-placeholder}
    anthropic:
      api-key: ${SPRING_AI_ANTHROPIC_API_KEY:disabled-placeholder}
    google:
      genai:
        api-key: ${SPRING_AI_GOOGLE_GENAI_API_KEY:disabled-placeholder}
  profiles:
    default: local
  main:
    web-application-type: reactive
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.154.143:5432/x_ai_gateway?connectionTimeZone=UTC}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:fuckharkadmin}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:192.168.154.143}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:nj363600}
      timeout: 5s
      database: 0
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:local}
    default-schema: public

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,configprops
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

gateway:
  admin-console:
    enabled: ${GATEWAY_ADMIN_CONSOLE_ENABLED:true}
    username: ${GATEWAY_ADMIN_CONSOLE_USERNAME:admin}
    password: ${GATEWAY_ADMIN_CONSOLE_PASSWORD:admin}
    session-ttl: ${GATEWAY_ADMIN_CONSOLE_SESSION_TTL:PT8H}
    challenge-ttl: ${GATEWAY_ADMIN_CONSOLE_CHALLENGE_TTL:PT5M}
    pow-difficulty: ${GATEWAY_ADMIN_CONSOLE_POW_DIFFICULTY:4}
    math-min: ${GATEWAY_ADMIN_CONSOLE_MATH_MIN:1}
    math-max: ${GATEWAY_ADMIN_CONSOLE_MATH_MAX:12}
  routing:
    interop-plan-enabled: true
    route-decision-logging-enabled: true
    runtime-store:
      type: ${GATEWAY_ROUTING_RUNTIME_STORE_TYPE:memory}
      key-prefix: ${GATEWAY_ROUTING_RUNTIME_STORE_KEY_PREFIX:}
      fallback-to-memory: ${GATEWAY_ROUTING_RUNTIME_STORE_FALLBACK_TO_MEMORY:true}
  cache:
    enabled: true
    sticky-by-distributed-key: true
    prefix-affinity-enabled: true
    fingerprint-affinity-enabled: true
    affinity-ttl: 30m
    fingerprint-max-prefix-tokens: 1024
    key-prefix: xag
  security:
    distributed-key-hash-only: true
    encrypt-upstream-api-key: true
    encryption-key: ${GATEWAY_ENCRYPTION_KEY:change-me-local-only}
  storage:
    file-root: ${GATEWAY_FILE_ROOT:.data/files}
  oauth:
    social-jwks-cache-ttl: ${GATEWAY_SOCIAL_JWKS_CACHE_TTL:PT30M}
    google-social-client-id: ${GATEWAY_GOOGLE_SOCIAL_CLIENT_ID:}
    google-social-client-secret: ${GATEWAY_GOOGLE_SOCIAL_CLIENT_SECRET:}
    github-social-client-id: ${GATEWAY_GITHUB_SOCIAL_CLIENT_ID:}
    github-social-client-secret: ${GATEWAY_GITHUB_SOCIAL_CLIENT_SECRET:}
    qq-social-client-id: ${GATEWAY_QQ_SOCIAL_CLIENT_ID:}
    qq-social-client-secret: ${GATEWAY_QQ_SOCIAL_CLIENT_SECRET:}
    wechat-social-client-id: ${GATEWAY_WECHAT_SOCIAL_CLIENT_ID:}
    wechat-social-client-secret: ${GATEWAY_WECHAT_SOCIAL_CLIENT_SECRET:}
    meta-social-client-id: ${GATEWAY_META_SOCIAL_CLIENT_ID:}
    meta-social-client-secret: ${GATEWAY_META_SOCIAL_CLIENT_SECRET:}
    x-social-client-id: ${GATEWAY_X_SOCIAL_CLIENT_ID:}
    x-social-client-secret: ${GATEWAY_X_SOCIAL_CLIENT_SECRET:}
  observability:
    async:
      enabled: ${GATEWAY_OBSERVABILITY_ASYNC_ENABLED:true}
      queue-key: ${GATEWAY_OBSERVABILITY_ASYNC_QUEUE_KEY:xag:observability:hot-path}
      flush-interval: ${GATEWAY_OBSERVABILITY_ASYNC_FLUSH_INTERVAL:PT1S}
      batch-size: ${GATEWAY_OBSERVABILITY_ASYNC_BATCH_SIZE:200}
